[project]
name = "veritas"
version = "0.1.0"
description = "VERITAS — Civil Litigation Verification Engine (Substantive Law + CPC Procedural Law)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "pydantic==2.13.5",
    "pdfplumber==0.11.4",
    "pypdf==5.0.1",
    "python-docx==1.1.2",
    "spacy==3.8.2",
    "rank-bm25==0.2.2",
    "chromadb==0.5.15",
    "sentence-transformers==3.2.1",
    "google-genai==2.23.0",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "rapidfuzz==3.10.0",
    "weasyprint==63.1",
    "markdown==3.7",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
